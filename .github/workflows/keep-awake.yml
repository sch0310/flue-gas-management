name: Keep Render Awake & Send WeChat Reminders

on:
  schedule:
    # 每天早上 8 点（北京时间）检查提醒
    - cron: '0 0 * * *'
    # 每 14 分钟访问一次，防止 Render 休眠
    - cron: '*/14 * * * *'
  workflow_dispatch:

jobs:
  keep-awake:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render Service
        run: |
          curl -s -o /dev/null -w "%{http_code}" https://flue-gas-management.onrender.com || true
          echo "✅ Render 服务已唤醒"
  
  check-reminders:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger WeChat Reminder Check
        run: |
          curl -s -X GET "https://flue-gas-management.onrender.com/check" -o /dev/null -w "%{http_code}" || true
          echo "✅ 微信提醒检查已触发"
